spring.application.name=securevault

spring.datasource.url=jdbc:postgresql://localhost:5432/securevault_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORDpostgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
securevault.jwt.secret=${JWT_SECRET}
securevault.admin.email=${INITIAL_ADMIN_EMAIL:}
securevault.admin.password=${INITIAL_ADMIN_PASSWORD:}

# Private document storage
securevault.storage.location=${SECUREVAULT_STORAGE_PATH:./securevault-private-storage}

# Document upload limits
securevault.storage.max-file-size-bytes=10485760
securevault.storage.allowed-content-types=application/pdf,image/png,image/jpeg
